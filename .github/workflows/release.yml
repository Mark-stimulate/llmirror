name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Check version
        shell: bash
        run: python tools/package_release.py --check
      - name: Install build dependencies
        run: python -m pip install -r tools/requirements-build.txt
      - name: Build Windows executable
        run: python tools/build_windows.py
      - name: Package Windows and Linux
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: llmirror-release
          path: release/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: llmirror-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
